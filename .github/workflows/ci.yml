name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.agent/scripts/**'
      # scripts/ holds sync_version.py itself — editing the guard did not
      # trigger the CI that runs it. Workflows widened to ** for the same
      # reason: editing one could not re-run the checks it defines.
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.agent/scripts/**'
      # scripts/ holds sync_version.py itself — editing the guard did not
      # trigger the CI that runs it. Workflows widened to ** for the same
      # reason: editing one could not re-run the checks it defines.
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install ruff pytest mypy pip-audit
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src/ tests/ --output-format=github

      - name: Syntax-check agent scripts
        run: python -m compileall -q .agent/scripts

      - name: Type check with MyPy
        run: mypy src/athena/ --ignore-missing-imports --no-error-summary

      - name: Anti-pattern check
        run: |
          # Check for bare except: blocks (strict hard gate)
          ! grep -rn "except:$" src/athena/ --include="*.py"
          # Check for pass-only exception handlers
          ! grep -rn -A1 "except.*:" src/athena/ --include="*.py" | grep -B1 "pass$" | head -20 || echo "::warning::Silent exception swallowing detected"

      - name: Check LaTeX / KaTeX leaks
        run: python .agent/scripts/check_latex_leak.py --all

      - name: Check Harness Score & Parity
        run: python .agent/scripts/harness_score.py --check --min=35.0

      - name: Dependency vulnerability audit
        # diskcache 5.6.3 default pickle vulnerability (PYSEC-2026-2447) is mitigated
        # in src/athena/core/security.py via JSONDisk (pickle-free serialization)
        run: pip-audit --desc --skip-editable --ignore-vuln PYSEC-2026-2447 --ignore-vuln GHSA-w8v5-vhqr-4h9v --ignore-vuln PYSEC-2026-3447

      - name: Run tests
        env:
          # Stub out external services for CI
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_KEY: "test-key"
          GOOGLE_API_KEY: "test-key"
        run: pytest tests/ -v --tb=short -x
