name: Athena SDK Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Version Sync Check
        # --check, not the bare writer. Without it this step rewrote the
        # files inside the runner, threw them away with the workspace and
        # exited 0 whatever the commit held — version drift could never fail
        # the build. Athena-Public fixed this 2026-07-24; this copy did not.
        run: python scripts/sync_version.py --check
      - name: Run Test Suite
        run: pytest tests/ -q --tb=short
