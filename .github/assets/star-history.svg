<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" fill="none">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #f0f6fc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .badge-bg { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 6px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #10b981; }
  </style>

  <!-- Background Card -->
  <rect width="800" height="420" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <text x="65" y="36" class="title">🌟 Star History</text>
  <text x="205" y="36" class="subtitle">yononsensedude/Athena-Public</text>

  <!-- Star Count Badge -->
  <rect x="650" y="18" width="110" height="30" class="badge-bg"/>
  <text x="705" y="38" class="badge-text" text-anchor="middle">★ 0 Stars</text>

  <!-- Grid Lines & Labels -->
  <line x1="65" y1="360.0" x2="760" y2="360.0" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="55" y="364.0" fill="#8b949e" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">0</text><line x1="65" y1="215.0" x2="760" y2="215.0" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="55" y="219.0" fill="#8b949e" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">10</text><line x1="65" y1="70.0" x2="760" y2="70.0" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="55" y="74.0" fill="#8b949e" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">20</text>
  <text x="65.0" y="395" fill="#8b949e" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">Oct 2026</text><text x="296.7" y="395" fill="#8b949e" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">Oct 2026</text><text x="528.3" y="395" fill="#8b949e" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">Oct 2026</text><text x="760.0" y="395" fill="#8b949e" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">Oct 2026</text>

  <!-- Area Fill Gradient -->
  <defs>
    <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Chart Area & Path -->
  <path d="M 65.0 360.0 L 65.0 360.0 L 65.0 360.0 Z" fill="url(#areaGradient)"/>
  <path d="M 65.0 360.0" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Current Position Marker -->
  <circle cx="65.0" cy="360.0" r="5" fill="#10b981" stroke="#0d1117" stroke-width="2"/>
</svg>